#
# Spike BS9, the key probe on Linux: the XToolkit logs every X key and button event a Java window receives
# (XWindow.handleKeyPress and handleButtonPressRelease log the raw XEvent at FINE on this logger) before AWT decides
# whether to post it; the key probe's own AWTEventListener shows what AWT then dispatched. Passed with
# -Djava.util.logging.config.file (Java 8's PlatformLogger routes to java.util.logging only when it is set).
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=ALL
.level=INFO
sun.awt.X11.event.XWindow.level=FINE
