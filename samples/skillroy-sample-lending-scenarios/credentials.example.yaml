# An example of the credentials file the sample's scenarios need (phase2-contracts.md 4). The real file is named
# credentials.yaml, is never committed (.gitignore names it) and must be readable by its owner only. It is found
# through --credentials, the system property skillroy.credentials, the environment variable SKILLROY_CREDENTIALS, or
# as bindings/<env>/credentials.yaml. The sample's own tests generate theirs from the made-up seed data.
#
# Every value below is a placeholder. Staff ids are compared as text: quote them.
#
# Use credentials of 8 or more characters for the test accounts of a real environment: a secret that long is masked
# wherever it occurs in any text the framework writes, even inside a longer text. A shorter secret is masked only
# where it is a whole value (or stands in double quotes inside a longer text), so the same digits inside a message, a
# time stamp or another number stay as they are. The sample's four-digit staff passwords are protected by
# construction (phase2-contracts.md 11.4): they never stand in a scenario, a plan or a bindings file, and they are
# sent and recorded only as whole values.
version: 1
credentials:
  staff:
    "100": { password: "<password of staff 100>" }
    "200": { password: "<password of staff 200>" }
# Optional: serve source "lending" over the controller-side JDBC channel instead of the agent's data.query. The
# desk serves its database on a loopback port when started with -Dlending.dbPort=<port> (0: a free port it picks
# and logs) and -Dlending.dbPassword=<password>; the account is read-only. The password below is the value the desk
# was launched with as -Dlending.dbPassword (the sample's end-to-end tests generate one of 12 characters per launch).
jdbc:
  lending:
    url: jdbc:hsqldb:hsql://127.0.0.1:9001/lending
    user: reader
    password: "<the value given to the desk as -Dlending.dbPassword>"
    statementTimeout: 10s
# The statement guard of both data channels is a safety net, not the boundary: give every source's account a
# read-only role. A PostgreSQL source should also carry the driver property that makes the connection read-only for
# real (it stops sequence calls and writes even with auto-commit on; it does not stop advisory locks):
#   properties: { readOnlyMode: always }
# On SQL Server the account's read-only role is the only boundary.
# Optional: the shortest secret that is also masked where it occurs inside a longer text (default 8, the rule above).
# An environment whose existing test accounts have short credentials may lower it, and accepts that every text which
# contains those characters is then hidden in the outputs. Nothing refuses a credential for its length.
#masking:
#  minLengthInText: 8
