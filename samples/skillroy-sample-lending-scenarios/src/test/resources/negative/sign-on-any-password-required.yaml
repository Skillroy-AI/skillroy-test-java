# Negative (phase8-contracts.md 7.5): the composite sign-on of assistant 100, whose slot declares no credential, so
# the call has no password for a staff member who needs one: lending.signOn takes the branch passwordRequired and
# raises the pack's warning lending.PASSWORD_REQUIRED, which the step does not accept: FAIL / ASSERTION naming it.
# The desk is left asking for the password, and the pack's recovery signs off.
scenario: sign-on-any-password-required
pack: lending
requires: [lending.signOn, lending.state]
launchProperties: { lending.seed: A }
resolve:
  assistant: { fixture: { code: "100" } }
steps:
  - signOnAny: { staff: $assistant }
on_prompt: { unexpected: fail }
timeouts: { step: 30s }
