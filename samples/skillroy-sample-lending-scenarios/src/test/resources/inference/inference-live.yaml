#
# The settings of the vision live test (phase7-contracts.md 7.3, 13.3): the live gateway, images on (the one switch for
# pixels), and the Haiku class mapped to claude-haiku-5-5 for item (4); the other classes keep their defaults. Read by
# VisionLiveIT under the profile inference-live only. It holds no key and no account value: the gateway reads
# ANTHROPIC_API_KEY from the environment, and a workspace-scoped key needs no workspace id.
version: 1
gateway: claude
models: {haiku: claude-haiku-5-5}
effort: {vision: low}
images: true
fallbacks: true
