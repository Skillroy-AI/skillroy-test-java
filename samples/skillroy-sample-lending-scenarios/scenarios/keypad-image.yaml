# Image baselines on the signed-off desk (phase7-contracts.md 12.4, 6.7, 8.7): the number pad (static, identical on
# both seeds) and the whole frame with the entry field masked by its locator. Each capture is compared exactly with
# the baseline of the target's render key (the Java line, the look and feel, the antialiasing, the screen scale, a
# probe render) in this environment's bindings file; the PNGs lie beside it under keypad-image.images/. A rendering
# without a baseline is REBIND_NEEDED in replay and is approved at its step in approve.
scenario: keypad-image
pack: lending
tags: [vision, image]
requires: [swing.capture.paint, swing.tree]
steps:
  - expectImage: { label: keypad, by: { id: numberPad } }
  - expectImage: { label: keypad-frame, mask: [ { by: { id: entry } } ] }
on_prompt: { unexpected: fail }
timeouts: { step: 30s }
