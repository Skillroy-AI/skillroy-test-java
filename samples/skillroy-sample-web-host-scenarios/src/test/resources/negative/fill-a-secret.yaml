# Item 7 of phase4-contracts.md 12.2: a secret from credentials.yaml filled into the page (whose script logs the
# item's value on purpose), then an expectation that cannot hold, so that the failure evidence is written. The
# secret must appear in no output: run.jsonl, the agent's log, the web.console events and the evidence carry it
# masked or not at all. The tests generate the credentials file (realm members) with a fresh value per run.
scenario: fill-a-secret
pack: webhost
web: { browser: { tag: front } }
resolve:
  member: { fixture: { code: "m-1" }, credential: { realm: members, key: code } }
steps:
  - webFill: { selector: "#item", text: $member.password }
  - expect: { "webhost.front.status": "never shown" }
timeouts: { step: 5s }
